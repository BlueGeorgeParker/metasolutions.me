// Roblox's average daily players (millions), from its SEC filings.
// 2018 and 2019 are full-year averages (S-1); Q3 2020 is derived from the S-1's nine-month average.
const PLAYERS = [
  [2018.5, 12.0], [2019.5, 17.6],
  [2020.125, 23.6], [2020.375, 33.4], [2020.625, 36.2], [2020.875, 37.1],
  [2021.125, 42.1], [2021.375, 43.2], [2021.625, 47.3], [2021.875, 49.5],
  [2022.125, 54.1], [2022.375, 52.2], [2022.625, 58.8], [2022.875, 58.8],
  [2023.125, 66.1], [2023.375, 65.5], [2023.625, 70.2], [2023.875, 71.5],
  [2024.125, 77.7], [2024.375, 79.5], [2024.625, 88.9], [2024.875, 85.3],
  [2025.125, 97.8], [2025.375, 111.8], [2025.625, 151.5], [2025.875, 144.0],
  [2026.125, 132.0], [2026.375, 123.0],
];
const LAUNCHED = 2006.67, PMAX = 160;
const PEAK = PLAYERS.reduce((a, b) => (b[1] > a[1] ? b : a)), LASTP = PLAYERS[PLAYERS.length - 1];
// Monotone cubic through the measured points, so the drawn curve never invents a higher peak.
const SLOPES = (() => {
  const n = PLAYERS.length, d = [], m = new Array(n);
  for (let i = 0; i < n - 1; i++) d[i] = (PLAYERS[i + 1][1] - PLAYERS[i][1]) / (PLAYERS[i + 1][0] - PLAYERS[i][0]);
  m[0] = d[0]; m[n - 1] = d[n - 2];
  for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (d[i] === 0) { m[i] = 0; m[i + 1] = 0; continue; }
    const a = m[i] / d[i], b = m[i + 1] / d[i], s = a * a + b * b;
    if (s > 9) { const k = 3 / Math.sqrt(s); m[i] = k * a * d[i]; m[i + 1] = k * b * d[i]; }
  }
  return m;
})();
// Daily players at time t: the curve where it was measured, a straight dashed run from launch before that, level after.
function playersAt(t) {
  const f = PLAYERS[0];
  if (t <= LAUNCHED) return 0;
  if (t <= f[0]) return f[1] * (t - LAUNCHED) / (f[0] - LAUNCHED);
  if (t >= LASTP[0]) return LASTP[1];
  let i = 0; while (PLAYERS[i + 1][0] < t) i++;
  const p = PLAYERS[i], q = PLAYERS[i + 1], h = q[0] - p[0], u = (t - p[0]) / h, u2 = u * u, u3 = u2 * u;
  return (2 * u3 - 3 * u2 + 1) * p[1] + (u3 - 2 * u2 + u) * h * SLOPES[i] + (-2 * u3 + 3 * u2) * q[1] + (u3 - u2) * h * SLOPES[i + 1];
}

// ---------- Theme + type ----------
const T = {};
function readTheme() {
  const cs = getComputedStyle(document.documentElement);
  for (const k of ['ground', 'card', 'ink', 'ink-soft', 'rule', 'line', 'local', 'thesis', 'thesis-ink']) T[k] = cs.getPropertyValue('--' + k).trim();
  T.title = cs.getPropertyValue('--font-title').trim() || 'serif';
  T.body = cs.getPropertyValue('--font-body').trim() || 'sans-serif';
}
readTheme();
const mctx = document.createElement('canvas').getContext('2d');
const font = (wt, px, fam, it) => `${it ? 'italic ' : ''}${wt} ${px}px ${fam}`;
function unitW(text, wt, fam, it) { mctx.font = font(wt, 100, fam, it); return mctx.measureText(text).width / 100; }
function wrap(text, wt, fam, size, maxW, it) {
  const words = text.split(/\s+/), out = [];
  let cur = '';
  for (const w of words) {
    const test = cur ? cur + ' ' + w : w;
    if (!cur || unitW(test, wt, fam, it) * size <= maxW) cur = test; else { out.push(cur); cur = w; }
  }
  if (cur) out.push(cur);
  return out.map(s => ({ s, w: unitW(s, wt, fam, it) * size }));
}
// A text block: lines laid out in world units, offsets from its node's top-left. `center` centres each line in maxW.
function block(text, o) {
  const lines = wrap(text, o.wt, o.fam, o.size, o.maxW, o.it);
  return { lines, size: o.size, lh: o.size * (o.lh || 1.3), wt: o.wt, fam: o.fam, it: o.it, color: o.color, dx: 0, dy: 0, maxW: o.maxW, center: !!o.center };
}
const fits = b => b.lines.every(l => l.w <= b.maxW + 0.01);
const heightOf = b => b.lines.length * b.lh;
// Stack blocks top to bottom from y with the gaps given; returns the bottom.
function stack(blocks, x, y, gaps) { blocks.forEach((b, i) => { b.dx = x; b.dy = y; y += heightOf(b) + (gaps[i] || 0); }); return y; }

// ---------- The ladder: each step out from the thesis is smaller and squarer ----------
// size: width and height in world units; n: the outline's squareness (2 = circle, higher = squarer); stroke weight.
const STEP = [
  { kind: 'thesis', w: 1080, h: 1080, n: 2, lw: 0 },
  { kind: 'string', w: 600, h: 600, n: 3.2, lw: 2.8 },
  { kind: 'idea', w: 430, h: 360, n: 6, lw: 2.2 },
  { kind: 'card', w: 250, h: 160, n: 24, lw: 1.6 },
];

function layoutThesis(n) {
  const R = n.w / 2, bw = R * 1.46, bh = R * 1.2, x0 = R - bw / 2;
  for (let tf = 100; tf >= 30; tf -= 2) {
    const ti = block(THESIS.title, { wt: 700, fam: T.title, size: tf, maxW: bw, color: 'thesis-ink', lh: 1.04, center: true });
    const no = block(THESIS.note, { wt: 400, fam: T.body, size: Math.max(15, tf * 0.28), maxW: bw * 0.9, color: 'thesis-ink', lh: 1.34, center: true, it: true });
    if (ti.lines.length > 4 || !fits(ti)) continue;
    const gap = tf * 0.42, h = heightOf(ti) + gap + heightOf(no);
    if (h > bh) continue;
    stack([ti, no], x0, R - h / 2, [gap]);
    no.dx = x0 + bw * 0.05;
    return [ti, no];
  }
  return [];
}
// Text inside a squircle or rounded rectangle sits in the box clear of its corners.
function inset(n) { const k = n.n <= 3.5 ? 0.13 : n.n <= 8 ? 0.06 : 0.05; return Math.max(n.w, n.h) * k + 6; }
function layoutString(n, a) {
  const pad = inset(n), iw = n.w - pad * 2, ih = n.h - pad * 2;
  // a point's name is a waypoint: big enough to read from the opening view, with its body small underneath
  for (let tf = 96; tf >= 12; tf -= 1) {
    const ti = block(a.title, { wt: 700, fam: T.title, size: tf, maxW: iw, color: 'ink', lh: 1.05 });
    const bo = block(a.body, { wt: 400, fam: T.body, size: clamp(tf * 0.24, 9, 20), maxW: iw, color: 'ink', lh: 1.32 });
    if (ti.lines.length > 3 || !fits(ti)) continue;
    const gap = tf * 0.4;
    if (heightOf(ti) + gap + heightOf(bo) > ih) continue;
    stack([ti, bo], pad, pad, [gap]);
    return [ti, bo];
  }
  return [];
}
function layoutIdea(n, d) {
  const pad = inset(n), iw = n.w - pad * 2, ih = n.h - pad * 2;
  const note = d.note || 'None yet';
  // a theme's name is a waypoint too: as big as three lines allow, with its note small underneath
  for (let tf = 72; tf >= 10; tf -= 1) {
    const ti = block(d.title, { wt: 700, fam: T.title, size: tf, maxW: iw, color: 'ink', lh: 1.05 });
    if (ti.lines.length > 3 || !fits(ti)) continue;
    const bs = clamp(tf * 0.2, 6.5, 12);
    const pg = block(d.pages, { wt: 700, fam: T.body, size: bs * 0.9, maxW: iw, color: 'line', lh: 1.2 });
    const lb = block('Our note', { wt: 700, fam: T.body, size: bs * 0.85, maxW: iw, color: 'ink-soft', lh: 1.2 });
    const no = block(note, { wt: 400, fam: T.body, size: bs, maxW: iw, color: d.note ? 'ink' : 'ink-soft', lh: 1.3, it: !d.note });
    const gaps = [tf * 0.3, bs * 0.7, bs * 0.15];
    if (heightOf(ti) + heightOf(pg) + heightOf(lb) + heightOf(no) + gaps[0] + gaps[1] + gaps[2] > ih) continue;
    stack([ti, pg, lb, no], pad, pad, gaps);
    return [ti, pg, lb, no];
  }
  return [];
}
// The event's name leads; the date sits under it, small.
// A featured event's name is a waypoint, as big as two lines of its bigger card allow.
function layoutEvent(n, c) {
  const pad = inset(n), iw = n.w - pad * 2, ih = n.h - pad * 2, k = n.w / STEP[3].w;
  for (let tf = n.featured ? 64 : 24; tf >= 8; tf -= 0.5) {
    for (let bf = 8 * k; bf >= 5.5 * k; bf -= 0.25) {
      const ti = block(c.title, { wt: 700, fam: T.title, size: tf, maxW: iw, color: 'ink', lh: 1.05 });
      const eb = block((c.au ? 'Australia · ' : '') + c.date, { wt: 700, fam: T.body, size: bf * 0.95, maxW: iw, color: c.au ? 'local' : 'ink-soft', lh: 1.2 });
      const bo = block(c.body, { wt: 400, fam: T.body, size: bf, maxW: iw, color: 'ink', lh: 1.25 });
      const so = block(c.src, { wt: 400, fam: T.body, size: bf * 0.8, maxW: iw, color: 'ink-soft', it: true, lh: 1.2 });
