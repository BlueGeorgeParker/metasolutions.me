// A series' value at time t, read along its drawn line (straight on a scale of tens, or on an even scale when
// `linear`), held at its ends.
function valueAt(s, t, linear) {
  const p = s.pts;
  if (t <= p[0][0]) return p[0][1];
  if (t >= p[p.length - 1][0]) return p[p.length - 1][1];
  let i = 0; while (p[i + 1][0] < t) i++;
  const u = (t - p[i][0]) / (p[i + 1][0] - p[i][0]);
  if (linear) return p[i][1] + (p[i + 1][1] - p[i][1]) * u;
  return Math.pow(10, Math.log10(p[i][1]) + (Math.log10(p[i + 1][1]) - Math.log10(p[i][1])) * u);

const T = {};
function readTheme() {

const PT = window.PathText || null;

    const ti = block(d.title, { wt: 700, fam: T.title, size: tf, maxW: tw, color: 'ink', lh: 1.06 });
    if (ti.lines.length > 3 || !fits(ti)) continue;
    const no = block(d.note, { wt: 400, fam: T.body, size: tf * 0.34, maxW: tw, color: 'ink-soft', lh: 1.35, it: true });
    const url = block(d.qr.label, { wt: 600, fam: T.body, size: tf * 0.36, maxW: side, color: 'ink-soft', lh: 1.2, center: true });
    const ag = tf * 0.5, aw = (iw - ag * (n - 1)) / n, ap = tf * 0.45;

      body: block(a.body, { wt: 400, fam: T.body, size: tf * 0.4, maxW: aw - ap * 2, color: 'ink-soft', lh: 1.35 }) }));
    const ah = Math.max(...args.map(a => heightOf(a.title) + tf * 0.3 + heightOf(a.body))) + ap * 2;
    const left = stack([ki, ti, no], pad, pad, [tf * 0.28, tf * 0.4]);
    const right = pad + side + tf * 0.25 + heightOf(url);
    if (Math.max(left, right) + gap + ah > pad + ih) continue;

    const ay = pad + ih - ah;

function makeGraph(c, spec) {
