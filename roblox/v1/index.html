  [2026.125, 132.0], [2026.375, 123.0],
].map(([t, m]) => ({ x: X(t), y: Y(m), t, m }));
const LAUNCH = { x: X(2006.67), y: 0 };
const PEAK = SERIES.reduce((a, b) => (b.m > a.m ? b : a));
const LAST = SERIES[SERIES.length - 1];

// Monotone cubic through the measured points, so the drawn curve never invents a higher peak.
const SL = (() => {
  const n = SERIES.length, d = [], m = new Array(n);
  for (let i = 0; i < n - 1; i++) d[i] = (SERIES[i + 1].y - SERIES[i].y) / (SERIES[i + 1].x - SERIES[i].x);
  m[0] = d[0]; m[n - 1] = d[n - 2];
  for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (d[i] === 0) { m[i] = 0; m[i + 1] = 0; continue; }
    const a = m[i] / d[i], b = m[i + 1] / d[i], s = a * a + b * b;
    if (s > 9) { const k = 3 / Math.sqrt(s); m[i] = k * a * d[i]; m[i + 1] = k * b * d[i]; }
  }
  return m;
})();
function curveAt(x) {
  if (x <= LAUNCH.x) return 0;
  const f = SERIES[0];
  if (x <= f.x) return LAUNCH.y + (f.y - LAUNCH.y) * (x - LAUNCH.x) / (f.x - LAUNCH.x);
  if (x >= LAST.x) return LAST.y;
  let i = 0; while (SERIES[i + 1].x < x) i++;
  const p = SERIES[i], q = SERIES[i + 1], h = q.x - p.x, t = (x - p.x) / h;
  const t2 = t * t, t3 = t2 * t;
  return (2 * t3 - 3 * t2 + 1) * p.y + (t3 - 2 * t2 + t) * h * SL[i] + (-2 * t3 + 3 * t2) * q.y + (t3 - t2) * h * SL[i + 1];
}

// ---------- Theme + type ----------
const T = {};
function readTheme() {
  const cs = getComputedStyle(document.documentElement);
  for (const k of ['ground', 'panel', 'card', 'ink', 'ink-soft', 'rule', 'curve', 'local']) T[k] = cs.getPropertyValue('--' + k).trim();
  T.title = cs.getPropertyValue('--font-title').trim() || 'sans-serif';
  T.body = cs.getPropertyValue('--font-body').trim() || 'sans-serif';
}
readTheme();
const mctx = document.createElement('canvas').getContext('2d');
const font = (wt, px, fam, it) => `${it ? 'italic ' : ''}${wt} ${px}px ${fam}`;
function unitW(text, wt, fam, it) { mctx.font = font(wt, 100, fam, it); return mctx.measureText(text).width / 100; }
function wrap(text, wt, fam, size, maxW, it) {
  const words = text.split(/\s+/), out = [];
  let cur = '';
  for (const w of words) {
    const test = cur ? cur + ' ' + w : w;
    if (!cur || unitW(test, wt, fam, it) * size <= maxW) cur = test; else { out.push(cur); cur = w; }
  }
  if (cur) out.push(cur);
  return out.map(s => ({ s, w: unitW(s, wt, fam, it) * size }));
}
// A text block: lines laid out in world units, offsets relative to its node's top-left.
function block(text, o) {
  const lines = wrap(text, o.wt, o.fam, o.size, o.maxW, o.it);
  return { lines, size: o.size, lh: o.size * (o.lh || 1.3), wt: o.wt, fam: o.fam, it: o.it, color: o.color, dx: o.dx || 0, dy: 0 };
}
const fits = b => b.lines.every(l => l.w <= b.maxW + 0.01);

// ---------- Build ----------
const CARD = 100, GAP = 8, PAD = 10;
let NODES = [], CARDS = [], RCARDS = [], FUTURE = null;

// The event's name leads; the date sits under it, small. Laid out for an 80-unit card and scaled by k.
function layoutEventCard(n, c) {
  const k = n.w / 80, pad = 6 * k, g = 2.5 * k, iw = n.w - pad * 2, ih = n.h - pad * 2;
  for (let tf = 12; tf >= 5; tf -= 0.5) {
    for (let bf = 4.8; bf >= 3.6; bf -= 0.2) {
      const ti = block(c.title, { wt: 800, fam: T.title, size: tf * k, maxW: iw, color: 'ink', lh: 1.08 });
      const eb = block((c.au ? 'Australia · ' : '') + c.date, { wt: 700, fam: T.body, size: 4.2 * k, maxW: iw, color: c.au ? 'local' : 'ink-soft', lh: 1.2 });
      const bo = block(c.body, { wt: 400, fam: T.body, size: bf * k, maxW: iw, color: 'ink' });
      const so = block(c.src, { wt: 400, fam: T.body, size: 3.5 * k, maxW: iw, color: 'ink-soft', it: true, lh: 1.2 });
      eb.maxW = ti.maxW = bo.maxW = so.maxW = iw;
      if (ti.lines.length > 3 || !fits(ti) || !fits(eb)) continue;
      const used = ti.lines.length * ti.lh + g + eb.lines.length * eb.lh + g + bo.lines.length * bo.lh + g + so.lines.length * so.lh;
      if (used > ih) continue;
      let y = pad;

// Laid out for a 48-unit card and scaled by k for any other size, so every news card reads the same.
// places: the other places this story appears; each becomes a door along the bottom of the card.
function layoutNewsCard(n, c, places) {
  const k = n.w / 48, pad = 4 * k, gap = 1.5 * k, iw = n.w - pad * 2, ih = n.h - pad * 2;
  // doors, flowed from the bottom edge up
  const ds = 1.9 * k, px = 1.1 * k, py = 0.8 * k, th = ds * 1.15 + py * 2, dg = 1 * k;
  const tiles = places.map(p => {
    let size = ds;
    while (unitW(p, 700, T.body) * size + px * 2 > iw && size > ds * 0.6) size *= 0.92;
    return { p, size, w: Math.min(iw, unitW(p, 700, T.body) * size + px * 2) };
  });
  const rowsOf = [];
  for (const t of tiles) { const r = rowsOf[rowsOf.length - 1]; if (r && r.w + dg + t.w <= iw) { r.items.push(t); r.w += dg + t.w; } else rowsOf.push({ items: [t], w: t.w }); }
  const head = places.length ? block('Also in', { wt: 700, fam: T.body, size: 1.8 * k, maxW: iw, color: 'ink-soft', lh: 1.2 }) : null;
  const doorsH = rowsOf.length ? (head.lines.length * head.lh + gap * 0.6 + rowsOf.length * th + (rowsOf.length - 1) * dg) : 0;
  const doors = [];
  let ry = n.h - pad - doorsH + (head ? head.lh + gap * 0.6 : 0);
  for (const r of rowsOf) {
    let rx = pad;
    for (const t of r.items) {
      const label = Object.assign(block(t.p, { wt: 700, fam: T.body, size: t.size, maxW: t.w, color: 'ink', lh: 1.15 }), { dx: px, dy: py + (ds - t.size) * 0.5 });
      doors.push({ dx: rx, dy: ry, w: t.w, h: th, label });
      rx += t.w + dg;
    }
    ry += th + dg;
  }
  if (head) { head.dx = pad; head.dy = n.h - pad - doorsH; }
  let best = null;
  for (let tf = 4.6; tf >= 2.6 && !best; tf -= 0.2) {
    for (let bf = 2.8; bf >= 1.6 && !best; bf -= 0.15) {
      const eb = block((c.au ? 'Australia · ' : '') + c.d + ' · ' + c.k, { wt: 700, fam: T.body, size: Math.min(2.3, bf) * k, maxW: iw, color: c.au ? 'local' : 'ink-soft', lh: 1.2 });
      const ti = block(c.o, { wt: 800, fam: T.title, size: tf * k, maxW: iw, color: 'ink', lh: 1.08 });
      const bo = block(c.w, { wt: 400, fam: T.body, size: bf * k, maxW: iw, color: 'ink' });
      eb.maxW = ti.maxW = bo.maxW = iw;
      if (ti.lines.length > 2 || !fits(ti) || !fits(eb)) continue;

      best = [eb, ti, bo];
    }

    const eb = block(c.d, { wt: 700, fam: T.body, size: 2.1 * k, maxW: iw, color: c.au ? 'local' : 'ink-soft', lh: 1.2 });
    const ti = block(c.o, { wt: 800, fam: T.title, size: 3 * k, maxW: iw, color: 'ink', lh: 1.08 });
    best = [eb, ti];
  }
  let y = pad;
  for (const b of best) { b.dx = pad; b.dy = y; y += b.lines.length * b.lh + gap; }
  return { blocks: head ? [...best, head] : best, doors };
}

function layoutIdea(n, d) {

    add(d.read, { wt: 400, fam: T.body, size: 7, color: 'ink' }, 8);
